# Repository settings
# This file configures branch protection rules that can be applied using the GitHub Settings App
# See: https://github.com/probot/settings

repository:
  # Repository name
  name: hero-home
  description: A modern fullstack web application connecting users with local service providers
  homepage: https://herohome-e9276.web.app/
  
  # Enable features
  has_issues: true
  has_projects: true
  has_wiki: true
  has_downloads: true
  
  # Default branch
  default_branch: main

# Branch protection rules
branches:
  - name: main
    # Branch protection settings
    protection:
      # Require pull request reviews before merging
      required_pull_request_reviews:
        # Number of approvals required
        required_approving_review_count: 1
        # Dismiss stale pull request approvals when new commits are pushed
        dismiss_stale_reviews: true
        # Require review from Code Owners
        require_code_owner_reviews: false
        # Restrict who can dismiss pull request reviews
        dismissal_restrictions:
          users: []
          teams: []
      
      # Require status checks to pass before merging
      required_status_checks:
        # Require branches to be up to date before merging
        strict: true
        # The list of status checks to require
        checks:
          - context: "ci"
      
      # Enforce all configured restrictions for administrators
      enforce_admins: false
      
      # Require linear history
      required_linear_history: true
      
      # Prevent force pushes
      allow_force_pushes: false
      
      # Prevent deletion
      allow_deletions: false
      
      # Require conversation resolution before merging
      required_conversation_resolution: true
      
      # Restrictions on who can push to the branch
      restrictions:
        apps: []
        users: []
        teams: []
